<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>RecipeHub</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
 
<!-- NAVBAR -->
<nav class="navbar">
    <div class="logo">🍲 RecipeHub</div>

    <input type="text" id="search" placeholder="Search recipes...">

    <select id="filter">
        <option value="all">All</option>
        <option value="indian">Indian</option>
        <option value="chinese">Chinese</option>
        <option value="western">Italian</option>
        <option value="dessert"> Indian Dessert</option>
        <option value="western">Western Dessert</option>
         <option value="western">Western</option>
    </select>
</nav>

<!-- HERO -->
<section class="hero">
    <h1>Discover Delicious Recipes 🍽️</h1>
    <p>Cook, Explore & Enjoy Amazing Dishes</p>
</section>

<!-- CATEGORY BUTTONS -->
<section class="categories">
    <button onclick="setCategory('all')">All</button>
    <button onclick="setCategory('indian')">Indian</button>
    <button onclick="setCategory('chinese')">Chinese</button>
    <button onclick="setCategory('italian')">Italian</button>
    <button onclick="setCategory('indiandessert')"> Indian Desserts</button>
    <button onclick="setCategory('westerndessert')">Western Dessert</button>
     <button onclick="setCategory('western')">Western</button>
</section>

<!-- RECIPES -->
<section id="recipes" class="recipes"></section>

<!-- MODAL -->
<div id="modal" class="modal">
    <div class="modal-content">
        <span class="close" onclick="closeModal()">&times;</span>
        <h2 id="modal-title"></h2>
        <p id="modal-text"></p>
    </div>
</div>

<!-- FOOTER -->
<footer>
    <p>© 2026 RecipeHub | Made by You 🚀</p>
</footer>

<script src="script.js"></script>
</body>
</html>
