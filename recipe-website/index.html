<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Recipe Hub</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- 🔝 NAVBAR -->
<nav class="navbar">
    <div class="logo">🍲 RecipeHub</div>

    <input type="text" id="search" placeholder="Search recipes...">

    <select id="filter">
        <option value="all">All</option>
        <option value="indian">Indian</option>
        <option value="chinese">Chinese</option>
        <option value="dessert">Dessert</option>
        <option value="western">Western</option>
    </select>
</nav>

<!-- 🎯 HERO SECTION -->
<section class="hero">
    <h1>Discover Delicious Recipes 🍽️</h1>
    <p>Cook, Explore & Enjoy Amazing Dishes</p>
</section>

<!-- 🍱 CATEGORY OPTIONS -->
<section class="categories">
    <button onclick="filterCategory('indian')">Indian</button>
    <button onclick="filterCategory('chinese')">Chinese</button>
    <button onclick="filterCategory('dessert')">Desserts</button>
    <button onclick="filterCategory('western')">Western</button>
</section>

<!-- 🍔 RECIPE CARDS -->
<section id="recipes" class="recipes"></section>

<!-- 📺 MODAL -->
<div id="modal" class="modal">
    <div class="modal-content">
        <span onclick="closeModal()" class="close">&times;</span>
        <h2 id="title"></h2>
        <p id="details"></p>
    </div>
</div>

<!-- 🔻 FOOTER -->
<footer>
    <p>© 2026 RecipeHub | Made by You 🚀</p>
</footer>

<script src="script.js"></script>
</body>
</html>
